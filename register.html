{% extends "base.html" %}
{% block title %}Register | AI StudyBuddy{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Create your account</h1><p>Save notes and practice with StudyBuddy.</p>
  <form method="post">
    <label>Full name</label><input name="name" required>
    <label>Email</label><input type="email" name="email" required>
    <label>Password (minimum 6 characters)</label><input type="password" name="password" minlength="6" required>
    <button type="submit">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</section>
{% endblock %}
